name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Workbook, Grafana, and Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate dashboard contracts
        shell: pwsh
        run: |
          $workbook = Get-Content -Raw workbook/azure-update-manager.workbook.json | ConvertFrom-Json
          $queries = @($workbook.items | Where-Object { $_.type -eq 3 })

          if ($queries.Count -eq 0) {
            throw 'The Workbook must contain at least one query item.'
          }

          $invalidQueries = @($queries | Where-Object {
            $_.content.queryType -ne 0 -or
            $_.content.resourceType -cne 'microsoft.operationalinsights/workspaces' -or
            $_.content.query -notmatch '\bConfigurationData\b'
          })

          if ($invalidQueries.Count -gt 0) {
            throw 'Every query must use the Log Analytics ConfigurationData table.'
          }

          $baselineQueryNames = @(
            'overall-baseline-compliance'
            'computer-baseline-compliance'
          )
          $invalidResourceGraphQueries = @($queries | Where-Object {
            $_.name -notin $baselineQueryNames -and
            $_.content.query -match '\bpatchassessmentresources\b'
          })
          if ($invalidResourceGraphQueries.Count -gt 0) {
            throw 'Only baseline compliance queries may use patchassessmentresources.'
          }

          $forbiddenTables = 'patchinstallationresources|maintenanceresources'
          if (($queries.content.query -join "`n") -match $forbiddenTables) {
            throw 'Installation and maintenance resource tables are outside the Workbook data contract.'
          }

          $grafana = Get-Content -Raw grafana/azure-update-manager.dashboard.json | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($grafana.uid)) {
            throw 'The Grafana dashboard must define a stable uid.'
          }

          $grafanaTargets = @($grafana.panels | ForEach-Object { @($_.targets) }) |
            Where-Object { $null -ne $_ }
          if ($grafanaTargets.Count -eq 0) {
            throw 'The Grafana dashboard must contain at least one query target.'
          }

          $invalidGrafanaTargets = @($grafanaTargets | Where-Object {
            $_.queryType -cne 'Azure Log Analytics' -or
            $_.datasource.type -cne 'grafana-azure-monitor-datasource' -or
            $_.azureLogAnalytics.query -notmatch '\bConfigurationData\b'
          })
          if ($invalidGrafanaTargets.Count -gt 0) {
            throw 'Every Grafana query must use Azure Monitor Logs and ConfigurationData.'
          }

          $grafanaSource = Get-Content -Raw grafana/azure-update-manager.dashboard.json
          foreach ($placeholder in @('__AZURE_SUBSCRIPTION_ID__', '__LOG_ANALYTICS_WORKSPACE_RESOURCE_ID__', '__AZURE_MONITOR_DATASOURCE_UID__')) {
            if ($grafanaSource -notmatch $placeholder) {
              throw "The Grafana dashboard is missing placeholder $placeholder."
            }
          }

          if ($grafanaSource -match '\$\{DS_AZURE_MONITOR\}') {
            throw 'The Grafana dashboard must not contain unresolved datasource inputs.'
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Import-GrafanaDashboard.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object Message) -join "`n"
          }

      - name: Build Bicep
        shell: bash
        run: |
          mkdir -p .build
          az bicep build --file infra/main.bicep --outfile .build/main.json