name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Workbook and Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bicep
        uses: azure/setup-bicep@v2

      - name: Validate Workbook JSON and data source
        shell: pwsh
        run: |
          $workbook = Get-Content -Raw workbook/azure-update-manager.workbook.json | ConvertFrom-Json
          $queries = @($workbook.items | Where-Object { $_.type -eq 3 })

          if ($queries.Count -eq 0) {
            throw 'The Workbook must contain at least one query item.'
          }

          $invalidQueries = @($queries | Where-Object {
            $_.content.queryType -ne 0 -or
            $_.content.resourceType -cne 'microsoft.operationalinsights/workspaces' -or
            $_.content.query -notmatch '\bConfigurationData\b'
          })

          if ($invalidQueries.Count -gt 0) {
            throw 'Every query must use the Log Analytics ConfigurationData table.'
          }

          $forbiddenTables = 'patchassessmentresources|patchinstallationresources|maintenanceresources'
          if (($queries.content.query -join "`n") -match $forbiddenTables) {
            throw 'Azure Resource Graph Update Manager tables are not allowed in this Workbook.'
          }

      - name: Build Bicep
        shell: bash
        run: |
          mkdir -p .build
          bicep build infra/main.bicep --outfile .build/main.json